name: GHCR Cleanup

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview untagged images to delete without removing anything'
        type: boolean
        required: false
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup untagged GHCR images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: ${{ github.event.inputs.dry_run == 'true' }}
          delete-untagged: true

      - name: Keep Workflow Alive
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
              printf 'Skipping Keep Workflow Alive: ACTIONS_TOKEN is not set.\n'
              exit 0
          fi
          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          printf "Keeping workflow active: %s\n" "$WORKFLOW_FILE"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/enable"
          printf "Workflow successfully kept alive.\n"
