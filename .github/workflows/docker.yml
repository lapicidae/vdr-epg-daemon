name: Docker Build & Push
on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - epgd-logo.svg
      - Jenkinsfile
  workflow_dispatch:
    inputs:
      tags:
        description: 'Scenario tags'
        type: choice
        options:
          - dry_run
          - bld_all
          - bld_debian
          - bld_ubuntu
          - bld_dev
        required: true
      version:
        description: 'epgd version (optional)'
        type: string
        required: false
      trigger:
        type: string
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Build Arguments
        id: get_arg
        run: |
          epgdREPO='https://github.com/horchi/vdr-epg-daemon.git'
          epgdHISTORY='https://raw.githubusercontent.com/horchi/vdr-epg-daemon/master/HISTORY.h'

          _history_ver() {
              awk -F'"' '/^#define[[:space:]]+_VERSION/ {print $2; exit}' "$@"
          }

          remoteTags="$(git ls-remote --tags --sort=-version:refname --refs "$epgdREPO")"
          latestUpstream="$(printf '%s\n' "$remoteTags" | head -n 1 | cut -d/ -f3)"
          [ -z "$latestUpstream" ] && latestUpstream="$(curl -fsSL "$epgdHISTORY" | _history_ver)"

          epgdVersion="${{ github.event.inputs.version }}"
          epgdVersion="${epgdVersion:-$latestUpstream}"
          matchLine="$(printf '%s\n' "$remoteTags" | awk -v ver="${epgdVersion#v}" '$2 == "refs/tags/" ver || $2 == "refs/tags/v" ver {print $1 "\t" $2; exit}')"
          if [ -n "$matchLine" ]; then
              epgdRevision="${matchLine%%$'\t'*}"
              epgdVersion="${matchLine##*/}"
          elif [ "${epgdVersion#v}" = "${latestUpstream#v}" ] && [ -n "$latestUpstream" ]; then
              epgdRevision="$(git ls-remote "$epgdREPO" HEAD | cut -f 1)"
          else
              printf 'Error: epgd version "%s" not found in %s\n' "$epgdVersion" "$epgdREPO" >&2
              exit 1
          fi

          vPatch="${epgdVersion#v}"

          highestVersion="$(
              {
                  printf '%s\n' "${latestUpstream#v}" "${vPatch}"
                  curl -fsSL "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.imageNAME }}/tags?page_size=100" 2>/dev/null | jq -r '.results[]?.name // empty' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || true
              } | sort -uV | tail -n 1
          )"
          isLatest='false'
          [ "$vPatch" = "$highestVersion" ] && isLatest='true'

          epgdDevVersion=''
          epgdDevRevision=''
          if [[ "${{ github.event.inputs.tags }}" =~ ^(bld_dev|bld_all|dry_run)$ ]]; then
              gitDIR=$(mktemp -d --suffix '_epgdGIT')
              git clone --quiet "$epgdREPO" "$gitDIR"
              cd "$gitDIR" || exit 1
              epgdDevVersion="$(git describe --tags 2>/dev/null)"
              [ -z "$epgdDevVersion" ] && [ -f HISTORY.h ] && epgdDevVersion="$(_history_ver HISTORY.h)"
              epgdDevRevision="$(git log --pretty=format:'%H' -n 1)"
              cd "$OLDPWD" || exit 1
              rm -rf "$gitDIR"
          fi

          pluginSngtvRevision="$(git ls-remote 'https://github.com/horchi/epgd-plugin-sngtv.git' HEAD | cut -f 1)"
          pluginTvmRevision="$(git ls-remote 'https://github.com/3PO/epgd-plugin-tvm.git' HEAD | cut -f 1)"
          pluginXmltvRevision="$(git ls-remote 'https://github.com/Zabrimus/epgd-plugin-xmltv.git' HEAD | cut -f 1)"
          tvsScraperVersion="$(git ls-remote --tags --sort=-version:refname --refs 'https://github.com/lapicidae/tvs-scraper.git' | head -n 1 | cut -d/ -f3)"

          printf 'dateTime=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          printf 'epgdRevision=%s\n' "${epgdRevision}" >> $GITHUB_OUTPUT
          printf 'epgdVersion=%s\n' "${epgdVersion}" >> $GITHUB_OUTPUT
          printf 'vPatch=%s\n' "${vPatch}" >> $GITHUB_OUTPUT
          printf 'isLatest=%s\n' "${isLatest}" >> $GITHUB_OUTPUT
          printf 'epgdDevVersion=%s\n' "${epgdDevVersion}" >> $GITHUB_OUTPUT
          printf 'epgdDevRevision=%s\n' "${epgdDevRevision}" >> $GITHUB_OUTPUT
          printf 'pluginSngtvRevision=%s\n' "${pluginSngtvRevision}" >> $GITHUB_OUTPUT
          printf 'pluginTvmRevision=%s\n' "${pluginTvmRevision}" >> $GITHUB_OUTPUT
          printf 'pluginXmltvRevision=%s\n' "${pluginXmltvRevision}" >> $GITHUB_OUTPUT
          printf 'tvsScraperVersion=%s\n' "${tvsScraperVersion}" >> $GITHUB_OUTPUT
          printf 'DEBIANbaseDIGEST=%s\n' "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${{ env.DEBIANbaseIMAGE }}:${{ env.DEBIANbaseTAG }}")" >> $GITHUB_OUTPUT
          printf 'UBUNTUbaseDIGEST=%s\n' "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${{ env.UBUNTUbaseIMAGE }}:${{ env.UBUNTUbaseTAG }}")" >> $GITHUB_OUTPUT
      - name: Docker Metadata - DEBIAN
        id: meta_debian
        if: ${{ (github.event.inputs.tags == 'bld_debian') || (github.event.inputs.tags == 'bld_all') || (github.event.inputs.tags == 'dry_run') }}
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.imageNAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{major}},value=${{ steps.get_arg.outputs.vPatch }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.get_arg.outputs.vPatch }}
            type=semver,pattern={{version}},value=${{ steps.get_arg.outputs.vPatch }}
            type=raw,value=debian
            type=raw,value=${{ env.latestTAG }},enable=${{ steps.get_arg.outputs.isLatest }}
      - name: Docker Metadata - UBUNTU
        id: meta_ubuntu
        if: ${{ (github.event.inputs.tags == 'bld_ubuntu') || (github.event.inputs.tags == 'bld_all') || (github.event.inputs.tags == 'dry_run') }}
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.imageNAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{major}},value=${{ steps.get_arg.outputs.vPatch }},prefix=ubuntu-
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.get_arg.outputs.vPatch }},prefix=ubuntu-
            type=semver,pattern={{version}},value=${{ steps.get_arg.outputs.vPatch }},prefix=ubuntu-
            type=raw,value=ubuntu
      - name: Docker Metadata - DEV
        id: meta_dev
        if: ${{ (github.event.inputs.tags == 'bld_dev') || (github.event.inputs.tags == 'bld_all') || (github.event.inputs.tags == 'dry_run') }}
        uses: docker/metadata-action@v6
        with:
          flavor: latest=false
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.imageNAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
      - name: Info
        run: |
          printf '<<<<<<<<< BUILD ARGUMENTS >>>>>>>>>\n'
          printf 'Build Timestamp:\t%s\n' "${{ steps.get_arg.outputs.dateTime }}"
          printf 'epgd Version:\t\t%s\n' "${{ steps.get_arg.outputs.epgdVersion }}"
          printf 'epgd Revision:\t\t%s\n' "${{ steps.get_arg.outputs.epgdRevision }}"
          printf 'Version:\t\t%s (latest: %s)\n' "${{ steps.get_arg.outputs.vPatch }}" "${{ steps.get_arg.outputs.isLatest }}"
          printf 'epgd Dev Version:\t%s\n' "${{ steps.get_arg.outputs.epgdDevVersion }}"
          printf 'epgd Dev Revision:\t%s\n' "${{ steps.get_arg.outputs.epgdDevRevision }}"
          printf 'Plugin sngtv Rev:\t%s\n' "${{ steps.get_arg.outputs.pluginSngtvRevision }}"
          printf 'Plugin tvm Rev:\t\t%s\n' "${{ steps.get_arg.outputs.pluginTvmRevision }}"
          printf 'Plugin xmltv Rev:\t%s\n' "${{ steps.get_arg.outputs.pluginXmltvRevision }}"
          printf 'tvs-scraper Version:\t%s\n' "${{ steps.get_arg.outputs.tvsScraperVersion }}"
          printf 'debian Base Digest:\t%s\n' "${{ steps.get_arg.outputs.DEBIANbaseDIGEST }}"
          printf 'Ubuntu Base Digest:\t%s\n' "${{ steps.get_arg.outputs.UBUNTUbaseDIGEST }}"
          printf '\n<<<<<<<<< GENERATED TAGS >>>>>>>>>\n'
          printf '[DEBIAN]\n%s\n' "${{ steps.meta_debian.outputs.tags }}"
          printf '[UBUNTU]\n%s\n' "${{ steps.meta_ubuntu.outputs.tags }}"
          printf '[DEV]\n%s\n' "${{ steps.meta_dev.outputs.tags }}"
      - name: Set up QEMU
        if: ${{ github.event.inputs.tags != 'dry_run' }}
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.tags != 'dry_run' }}
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: ${{ github.event.inputs.tags != 'dry_run' }}
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: ${{ github.event.inputs.tags != 'dry_run' }}
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push - DEBIAN
        if: ${{ (github.event.inputs.tags == 'bld_debian') || (github.event.inputs.tags == 'bld_all') }}
        uses: docker/build-push-action@v7
        with:
          build-args: |
            EPGD_DEV=false
            baseDIGEST=${{ steps.get_arg.outputs.DEBIANbaseDIGEST }}
            baseIMAGE=${{ env.DEBIANbaseIMAGE }}
            baseTAG=${{ env.DEBIANbaseTAG }}
            dateTime=${{ steps.get_arg.outputs.dateTime }}
            epgdRevision=${{ steps.get_arg.outputs.epgdRevision }}
            epgdVersion=${{ steps.get_arg.outputs.epgdVersion }}
            pluginSngtvRevision=${{ steps.get_arg.outputs.pluginSngtvRevision }}
            pluginTvmRevision=${{ steps.get_arg.outputs.pluginTvmRevision }}
            pluginXmltvRevision=${{ steps.get_arg.outputs.pluginXmltvRevision }}
            tvsScraperVersion=${{ steps.get_arg.outputs.tvsScraperVersion }}
          annotations: |
            ${{ env.commonANNOTATIONS }}
            index,manifest:org.opencontainers.image.base.digest=${{ steps.get_arg.outputs.DEBIANbaseDIGEST }}
            index,manifest:org.opencontainers.image.base.name=docker.io/library/${{ env.DEBIANbaseIMAGE }}:${{ env.DEBIANbaseTAG }}
            index,manifest:org.opencontainers.image.created=${{ steps.get_arg.outputs.dateTime }}
            index,manifest:org.opencontainers.image.revision=${{ steps.get_arg.outputs.epgdRevision }}
            index,manifest:org.opencontainers.image.version=${{ steps.get_arg.outputs.epgdVersion }}
          no-cache: true
          push: true
          tags: ${{ steps.meta_debian.outputs.tags }}
      - name: Build and push - UBUNTU
        if: ${{ (github.event.inputs.tags == 'bld_ubuntu') || (github.event.inputs.tags == 'bld_all') }}
        uses: docker/build-push-action@v7
        with:
          build-args: |
            EPGD_DEV=false
            baseDIGEST=${{ steps.get_arg.outputs.UBUNTUbaseDIGEST }}
            baseIMAGE=${{ env.UBUNTUbaseIMAGE }}
            baseTAG=${{ env.UBUNTUbaseTAG }}
            dateTime=${{ steps.get_arg.outputs.dateTime }}
            epgdRevision=${{ steps.get_arg.outputs.epgdRevision }}
            epgdVersion=${{ steps.get_arg.outputs.epgdVersion }}
            pluginSngtvRevision=${{ steps.get_arg.outputs.pluginSngtvRevision }}
            pluginTvmRevision=${{ steps.get_arg.outputs.pluginTvmRevision }}
            pluginXmltvRevision=${{ steps.get_arg.outputs.pluginXmltvRevision }}
            tvsScraperVersion=${{ steps.get_arg.outputs.tvsScraperVersion }}
          annotations: |
            ${{ env.commonANNOTATIONS }}
            index,manifest:org.opencontainers.image.base.digest=${{ steps.get_arg.outputs.UBUNTUbaseDIGEST }}
            index,manifest:org.opencontainers.image.base.name=docker.io/library/${{ env.UBUNTUbaseIMAGE }}:${{ env.UBUNTUbaseTAG }}
            index,manifest:org.opencontainers.image.created=${{ steps.get_arg.outputs.dateTime }}
            index,manifest:org.opencontainers.image.revision=${{ steps.get_arg.outputs.epgdRevision }}
            index,manifest:org.opencontainers.image.version=${{ steps.get_arg.outputs.epgdVersion }}
          no-cache: true
          push: true
          tags: ${{ steps.meta_ubuntu.outputs.tags }}
      - name: Build and push - DEV
        if: ${{ (github.event.inputs.tags == 'bld_dev') || (github.event.inputs.tags == 'bld_all') }}
        uses: docker/build-push-action@v7
        with:
          build-args: |
            EPGD_DEV=true
            baseDIGEST=${{ steps.get_arg.outputs.DEBIANbaseDIGEST }}
            baseIMAGE=${{ env.DEBIANbaseIMAGE }}
            baseTAG=${{ env.DEBIANbaseTAG }}
            dateTime=${{ steps.get_arg.outputs.dateTime }}
            epgdRevision=${{ steps.get_arg.outputs.epgdDevRevision }}
            epgdVersion=${{ steps.get_arg.outputs.epgdDevVersion }}
            pluginSngtvRevision=${{ steps.get_arg.outputs.pluginSngtvRevision }}
            pluginTvmRevision=${{ steps.get_arg.outputs.pluginTvmRevision }}
            pluginXmltvRevision=${{ steps.get_arg.outputs.pluginXmltvRevision }}
            tvsScraperVersion=${{ steps.get_arg.outputs.tvsScraperVersion }}
          annotations: |
            ${{ env.commonANNOTATIONS }}
            index,manifest:org.opencontainers.image.base.digest=${{ steps.get_arg.outputs.DEBIANbaseDIGEST }}
            index,manifest:org.opencontainers.image.base.name=docker.io/library/${{ env.DEBIANbaseIMAGE }}:${{ env.DEBIANbaseTAG }}
            index,manifest:org.opencontainers.image.created=${{ steps.get_arg.outputs.dateTime }}
            index,manifest:org.opencontainers.image.revision=${{ steps.get_arg.outputs.epgdDevRevision }}
            index,manifest:org.opencontainers.image.version=${{ steps.get_arg.outputs.epgdDevVersion }}
          no-cache: true
          push: true
          tags: ${{ steps.meta_dev.outputs.tags }}
      - name: Send mail
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tags != 'dry_run' }}
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.GMAIL_USER}}
          password: ${{secrets.GMAIL_PASS}}
          from: GitHub <notifications@github.com>
          to: ${{secrets.EMAIL}}
          subject: "Action ${{job.status}}: ${{github.repository}} - ${{github.workflow}} (${{github.event.inputs.tags}}) #${{github.run_id}}"
          body: |
            ${{job.status}}
            Action "${{github.workflow}} (${{github.event.inputs.tags}})" started by ${{github.actor}} (${{ github.event.inputs.trigger }}) in ${{github.repository}}.
            View workflow run: ${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
            Your faithful employee
            ${{runner.name}} (${{runner.os}} - ${{runner.arch}})
          html_body: |
            <!DOCTYPE html>
            <html>
            <body>
            <h1 style="text-transform:uppercase">${{job.status}}</h1>
            <p>Action "${{github.workflow}} (${{github.event.inputs.tags}})" started by ${{github.actor}} (${{ github.event.inputs.trigger }}) in ${{github.repository}}.</p>
            <p><a href="${{github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}" target="_blank" style="background-color:#4CAF50; border:none; color:white; padding:20px; text-align:center; text-decoration:none; display:inline-block; font-size:16px; margin:4px 2px; cursor:pointer; border-radius:12px;">View workflow run</a></p>
            <p>Your faithful employee<br>
            ${{runner.name}} (${{runner.os}} - ${{runner.arch}})</p>
            </body>
            </html>
          priority: low
    env:
      commonANNOTATIONS: |-
        index,manifest:org.opencontainers.image.authors=A. Hemmerle <github.com/lapicidae>
        index,manifest:org.opencontainers.image.description=${{ github.event.repository.description || 'Download EPG data from the internet and manage it in a MariaDB/MySQL database' }}
        index,manifest:org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/master/README.md
        index,manifest:org.opencontainers.image.licenses=GPL-2.0-only AND GPL-3.0-only AND GPL-3.0-or-later
        index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        index,manifest:org.opencontainers.image.title=epgd
        index,manifest:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
        index,manifest:org.opencontainers.image.vendor=${{ github.repository_owner }}
      imageNAME: vdr-epg-daemon
      latestTAG: latest
      DEBIANbaseIMAGE: debian
      DEBIANbaseTAG: stable-slim
      UBUNTUbaseIMAGE: ubuntu
      UBUNTUbaseTAG: latest
